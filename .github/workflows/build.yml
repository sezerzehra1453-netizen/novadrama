name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Install API 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Fix Android 36 SDK override
        run: |
          find android/ -name "build.gradle" -exec sed -i 's/compileSdk 36/compileSdk 34/g' {} +
          find android/ -name "build.gradle" -exec sed -i 's/compileSdkVersion 36/compileSdkVersion 34/g' {} +
          find android/ -name "build.gradle" -exec sed -i 's/targetSdkVersion 36/targetSdkVersion 34/g' {} +
          find android/ -name "variables.gradle" -exec sed -i 's/compileSdkVersion = 36/compileSdkVersion = 34/g' {} +
          find android/ -name "variables.gradle" -exec sed -i 's/targetSdkVersion = 36/targetSdkVersion = 34/g' {} +

      - name: Setup Gradle 8.2.1 Wrapper
        run: |
          cd android
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -Lo gradlew https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradlew
          chmod +x gradlew

      - name: Build APK and AAB
        run: |
          cd android
          ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/*.aab
