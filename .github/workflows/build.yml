name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
          cache-disabled: true

      - name: Accept Android Licenses & SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Fix Android SDK Versions
        run: |
          find android/ -name "*.gradle" -exec sed -i 's/compileSdk 36/compileSdk 34/g' {} +
          find android/ -name "*.gradle" -exec sed -i 's/compileSdkVersion 36/compileSdkVersion 34/g' {} +
          find android/ -name "*.gradle" -exec sed -i 's/targetSdkVersion 36/targetSdkVersion 34/g' {} +
          find android/ -name "*.gradle" -exec sed -i 's/compileSdkVersion = 36/compileSdkVersion = 34/g' {} +
          find android/ -name "*.gradle" -exec sed -i 's/targetSdkVersion = 36/targetSdkVersion = 34/g' {} +

      - name: Build APK and AAB
        run: |
          cd android
          gradle assembleDebug bundleRelease --no-daemon --no-parallel --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/*.aab
